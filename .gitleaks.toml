# gitleaks 설정 (시크릿 스캐너)
# pre-commit `gitleaks` 훅이 이 설정을 자동 탐지한다(트렁크는 폐기됨).
title = "dagster-study gitleaks config"

# 기본 규칙셋을 확장 사용
[extend]
useDefault = true

[allowlist]
description = "자리표시자·문서용 예약값만 오탐 제외한다(경로 통째 제외 금지 — 문서에 붙여넣은 실제 키를 놓친다)"

# 값이 비어 있는 예시 파일만 경로로 제외한다.
paths = [
    '''\.env\.example$''',
]

# 문서·예시에 쓰는 자리표시자 패턴. 실제 키는 이 패턴에 걸리지 않으므로 탐지가 유지된다.
regexes = [
    '''ocid1\.[a-z]+\.oc1\.\.x+''',        # OCID 자리표시자 (ocid1.tenancy.oc1..xxxxx)
    '''x{4,}''',                            # xxxxx 류 마스킹
    '''TODO-''',                            # 채우기 전 표식
    '''(aa:bb:cc|11:22:33)''',              # 더미 fingerprint
    '''203\.0\.113\.\d{1,3}''',             # RFC 5737 문서용 IP (TEST-NET-3)
    '''198\.51\.100\.\d{1,3}''',            # RFC 5737 TEST-NET-2
]

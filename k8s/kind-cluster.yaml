# kind 클러스터 (로컬 K8s, Podman provider) — 재설계 PoC Phase 0
# 로컬 레지스트리 localhost:5001을 호스트·클러스터 공통 이름으로 사용
# (certs.d config_path 방식 — k8s-up.sh가 각 노드에 hosts.toml 주입)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lakehouse
containerdConfigPatches:
    - |-
        [plugins."io.containerd.grpc.v1.cri".registry]
            config_path = "/etc/containerd/certs.d"
nodes:
    # PoC는 단일 노드. executor 스케줄 확인이 필요하면 worker role 노드를 추가한다.
    - role: control-plane
      # Ingress용 포트 공개 — **클러스터 생성 시점에만 지정 가능**하다.
      # kind 노드는 컨테이너라 공개 포트를 사후에 추가할 수 없어, 빠뜨리면 재생성해야 한다.
      # 호스트 포트를 80/443이 아니라 8080/8443으로 두는 이유: macOS에서 1024 미만 포트
      # 바인딩은 root가 필요한데 podman의 포트 포워딩은 사용자 권한으로 동작한다.
      extraPortMappings:
          - containerPort: 80
            hostPort: 8080
            listenAddress: "127.0.0.1"
            protocol: TCP
          - containerPort: 443
            hostPort: 8443
            listenAddress: "127.0.0.1"
            protocol: TCP

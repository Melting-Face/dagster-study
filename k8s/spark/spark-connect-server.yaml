# Spark Connect 서버 — dbt-spark가 붙는 **상시 SQL 엔드포인트**(Phase 1)
#
# 왜 이게 필요한가: 기존 컴퓨트는 `SparkApplication`(job-per-application)이라 잡이 끝나면 사라진다.
#   dbt는 세션에 계속 붙어 SQL을 날려야 하므로 붙을 대상이 없다. Thrift(HiveServer2) 대신
#   **Spark Connect**를 쓴다 — gRPC 기반이라 클라이언트가 가볍고(pyspark[connect]),
#   dbt-spark의 `method: session`에 `spark.remote`만 주면 그대로 원격이 된다(어댑터 변경 불필요).
#
# ⚠️ 자원 규칙과의 관계: 이 서버는 **상주**한다. conventions/k8s.md §9-3의 시분할(BATCH/STREAM 교대)과
#   달리 항상 CPU/메모리를 점유하므로, 쓰지 않을 때는 `kubectl scale deploy/spark-connect --replicas=0`.
#
# 크리덴셜은 Secret→env로 주입하고 셸에서 확장한다(매니페스트 평문 금지, §4).
apiVersion: apps/v1
kind: Deployment
metadata:
    name: spark-connect
    namespace: default
spec:
    replicas: 1
    selector:
        matchLabels: {app: spark-connect}
    template:
        metadata:
            labels: {app: spark-connect}
        spec:
            serviceAccountName: spark
            containers:
                - name: spark-connect
                  image: localhost:5001/spark-runner:0.5.0
                  imagePullPolicy: Always
                  # `spark.hadoop.fs.*` 가 따로 필요한 이유:
                  #   Iceberg의 S3FileIO(`io-impl`)는 **카탈로그가 아는 파일**만 읽고 쓴다.
                  #   반면 `remove_orphan_files`는 warehouse 디렉터리를 **Hadoop FileSystem으로 나열**해
                  #   카탈로그가 모르는 파일을 찾아낸다 → S3FileIO로는 대체가 안 된다.
                  #   설정이 없으면 `UnsupportedFileSystemException: No FileSystem for scheme "s3"`로 죽는다
                  #   (2026-08-19 실측). warehouse가 `s3://`라 `fs.s3.impl`도 S3A로 매핑해야 한다.
                  #   jar(hadoop-aws·aws-java-sdk-bundle)는 러너 이미지에 이미 구워져 있다.
                  #
                  # 🔴 이 파드에는 S3 접근 경로가 **둘**이고, aws-chunked 체크섬 영향이 서로 다르다.
                  #   ① S3A(`spark.hadoop.fs.s3*`) → aws-java-sdk-bundle = AWS SDK **v1**(1.12.262)
                  #      → flexible checksum이 없어 SeaweedFS의 aws-chunked 문제와 **무관**하다.
                  #   ② S3FileIO(Iceberg `io-impl`, iceberg-aws-bundle) → AWS SDK **v2**
                  #      → **영향받는다.** 아래 env 2종이 없으면 PUT 객체가 손상된 채 저장된다.
                  #   이전 주석은 ①만 보고 "무관"으로 닫아 ②의 설정 누락이 잠복했다.
                  #   2026-08-21 실측 — aws-bundle 1.6.1(SDK v2 2.26.20)에서는 문제없었으나
                  #   1.11.0(SDK v2 2.44.4)에서 PUT 객체가 aws-chunked 프레이밍인 채 저장됨.
                  command: ["/bin/bash", "-c"]
                  args:
                      - |
                        exec /opt/spark/bin/spark-submit \
                          --class org.apache.spark.sql.connect.service.SparkConnectServer \
                          --master "local[2]" \
                          --conf spark.connect.grpc.binding.port=15002 \
                          --conf spark.sql.extensions="$ICEBERG_EXTENSIONS" \
                          --conf spark.sql.catalog.iceberg=org.apache.iceberg.spark.SparkCatalog \
                          --conf spark.sql.catalog.iceberg.catalog-impl=org.apache.iceberg.jdbc.JdbcCatalog \
                          --conf spark.sql.catalog.iceberg.uri="$ICEBERG_JDBC_URI" \
                          --conf spark.sql.catalog.iceberg.jdbc.user="$PG_USER" \
                          --conf spark.sql.catalog.iceberg.jdbc.password="$PG_PASSWORD" \
                          --conf spark.sql.catalog.iceberg.warehouse="$ICEBERG_WAREHOUSE" \
                          --conf spark.sql.catalog.iceberg.io-impl=org.apache.iceberg.aws.s3.S3FileIO \
                          --conf spark.sql.catalog.iceberg.s3.endpoint="$S3_ENDPOINT" \
                          --conf spark.sql.catalog.iceberg.s3.path-style-access=true \
                          --conf spark.sql.defaultCatalog=iceberg \
                          --conf spark.hadoop.fs.s3.impl=org.apache.hadoop.fs.s3a.S3AFileSystem \
                          --conf spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem \
                          --conf spark.hadoop.fs.s3a.endpoint="$S3_ENDPOINT" \
                          --conf spark.hadoop.fs.s3a.path.style.access=true \
                          --conf spark.hadoop.fs.s3a.connection.ssl.enabled=false \
                          spark-internal
                  ports:
                      - {name: grpc, containerPort: 15002}
                      - {name: ui, containerPort: 4040}
                  env:
                      # CNPG가 만드는 쓰기 서비스(`-rw`). 읽기 전용은 `-ro`.
                      - {name: ICEBERG_JDBC_URI, value: "jdbc:postgresql://catalog-postgres-rw:5432/iceberg"}
                      - {name: ICEBERG_WAREHOUSE, value: "s3://warehouse"}
                      # 줄 길이 제한(yamllint 120) 회피 겸 재사용 — Iceberg SQL 확장 FQCN
                      - name: ICEBERG_EXTENSIONS
                        value: "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
                      - {name: S3_ENDPOINT, value: "http://seaweedfs:8333"}
                      - {name: AWS_REGION, value: "us-east-1"}
                      # SeaweedFS는 AWS SDK v2의 aws-chunked 프레이밍을 풀지 못해 객체가 조용히 손상된다.
                      # S3FileIO(위 주석 ②)가 SDK v2를 타므로 필수다(CLAUDE.md 운영 §K8s).
                      - {name: AWS_REQUEST_CHECKSUM_CALCULATION, value: "when_required"}
                      - {name: AWS_RESPONSE_CHECKSUM_VALIDATION, value: "when_required"}
                      # PG 크리덴셜은 CNPG bootstrap 시크릿(basic-auth라 키 이름이 username/password 고정)
                      - name: PG_USER
                        valueFrom: {secretKeyRef: {name: catalog-pg-app, key: username}}
                      - name: PG_PASSWORD
                        valueFrom: {secretKeyRef: {name: catalog-pg-app, key: password}}
                      # S3 키는 AWS 표준 자격증명 체인으로 넘긴다(--conf에 안 적는다)
                      - name: AWS_ACCESS_KEY_ID
                        valueFrom: {secretKeyRef: {name: lakehouse-creds, key: s3-access-key}}
                      - name: AWS_SECRET_ACCESS_KEY
                        valueFrom: {secretKeyRef: {name: lakehouse-creds, key: s3-secret-key}}
                  readinessProbe:
                      tcpSocket: {port: 15002}
                      initialDelaySeconds: 20
                      periodSeconds: 10
                  resources:
                      requests: {cpu: "500m", memory: "1536Mi"}
                      limits: {cpu: "1", memory: "2Gi"}
---
apiVersion: v1
kind: Service
metadata:
    name: spark-connect
    namespace: default
spec:
    selector: {app: spark-connect}
    ports:
        - {name: grpc, port: 15002, targetPort: 15002}
        - {name: ui, port: 4040, targetPort: 4040}
---
# Spark Web UI 고정 URL — http://spark.localtest.me:8080 (kind extraPortMappings 8080→80)
# gRPC(15002)는 Ingress로 내보내지 않는다. nginx ingress의 gRPC 백엔드는 별도 설정(TLS 등)이
# 필요하고, dbt는 port-forward나 in-cluster 주소로 붙으면 충분하다(YAGNI).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: spark-connect-ui
    namespace: default
spec:
    ingressClassName: nginx
    rules:
        - host: spark.localtest.me
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: spark-connect
                            port:
                                number: 4040

# dbt-trino 프로파일: Trino를 통해 Iceberg(JDBC 카탈로그) 레이크하우스에 적재
# database = Trino 카탈로그명(iceberg.properties의 catalog-name과 일치), schema = Trino 스키마
dbt_pipelines:
  outputs:
    dev:
      type: trino
      method: none # dev 환경: 인증 없음
      user: dagster
      host: trino
      port: 8080
      http_scheme: http
      database: iceberg # Trino 카탈로그 (= iceberg.properties catalog-name)
      schema: dev # Trino 스키마 (없으면 dbt가 생성)
      threads: 4

    prod:
      type: trino
      method: none
      user: dagster
      host: trino
      port: 8080
      http_scheme: http
      database: iceberg
      schema: prod
      threads: 8

    # --- Phase 1 이행: dbt-spark 타깃 ---
    # 실행 엔진을 프로파일로 갈아끼운다. `method: session`은 pyspark로 SparkSession을 만들고,
    # `server_side_parameters`는 **세션 생성 시 builder.config()로 적용**된다(어댑터 소스 확인).
    # 덕분에 Iceberg 설정을 전부 여기에 두면서 **비밀정보는 env_var 참조**로 유지할 수 있다.
    #
    # spark_session : 호스트 로컬 Spark. 클러스터 상시 서비스 없이 22모델 방언 검증용.
    #                 in-cluster 서비스(카탈로그 PG·SeaweedFS)는 port-forward가 필요하다.
    # spark_connect : 클러스터의 Spark Connect 서버에 붙는다(컴퓨트=K8s 원칙). `spark.remote`만 다르다.
    spark_session: &spark_session
      type: spark
      method: session
      host: localhost # session 메서드에선 미사용(스키마 필수 필드)
      schema: poc
      threads: 1
      server_side_parameters:
        # 러너 이미지와 **같은 Iceberg 버전**을 쓴다(Spark 3.5 계열).
        spark.jars.packages: "org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:{{ env_var('ICEBERG_VERSION', '1.6.1') }},org.apache.iceberg:iceberg-aws-bundle:{{ env_var('ICEBERG_VERSION', '1.6.1') }},org.postgresql:postgresql:42.7.4"
        spark.sql.extensions: "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
        spark.sql.catalog.jdbccat: "org.apache.iceberg.spark.SparkCatalog"
        spark.sql.catalog.jdbccat.catalog-impl: "org.apache.iceberg.jdbc.JdbcCatalog"
        spark.sql.catalog.jdbccat.uri: "{{ env_var('ICEBERG_JDBC_URI') }}"
        spark.sql.catalog.jdbccat.jdbc.user: "{{ env_var('ICEBERG_PG_USER') }}"
        spark.sql.catalog.jdbccat.jdbc.password: "{{ env_var('ICEBERG_PG_PASSWORD') }}"
        spark.sql.catalog.jdbccat.warehouse: "{{ env_var('ICEBERG_WAREHOUSE') }}"
        spark.sql.catalog.jdbccat.io-impl: "org.apache.iceberg.aws.s3.S3FileIO"
        spark.sql.catalog.jdbccat.s3.endpoint: "{{ env_var('ICEBERG_S3_ENDPOINT') }}"
        spark.sql.catalog.jdbccat.s3.path-style-access: "true"
        # S3 키는 AWS 표준 env(AWS_ACCESS_KEY_ID/SECRET)로 자격증명 체인이 집어간다 → 여기 적지 않는다.
        spark.sql.defaultCatalog: "jdbccat"

    spark_connect:
      <<: *spark_session
      server_side_parameters:
        spark.remote: "{{ env_var('SPARK_REMOTE', 'sc://localhost:15002') }}"

  target: dev
